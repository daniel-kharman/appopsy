name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs (version in the trailing comment);
# Dependabot updates both together.

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  # One stable check for the branch ruleset: it passes only if every matrix run of
  # `check` succeeded (a skipped or cancelled run counts as a failure).
  ci-ok:
    runs-on: ubuntu-latest
    needs: check
    if: always()
    steps:
      - name: All checks passed
        env:
          RESULT: ${{ needs.check.result }}
        run: |
          echo "check: $RESULT"
          test "$RESULT" = "success"
