name: Bug report
description: Something in appopsy doesn't work or reports something wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **Never paste raw dumps, case folders or unredacted reports here.** They show which apps you have and what they did. Run `appopsy report <case> --redact`, **read the redacted copy first**, and paste only the lines you need.

        Security problems: please don't open an issue. Use [private vulnerability reporting](https://github.com/daniel-kharman/appopsy/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: appopsy audit --pack privacy
  - type: input
    id: version
    attributes:
      label: appopsy version
      description: Output of `appopsy --version`.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone
      description: Manufacturer, model and Android version (no serial number).
      placeholder: Google Pixel, Android 17
  - type: textarea
    id: excerpt
    attributes:
      label: Redacted excerpt or error
      description: The error message, or a few lines from a **redacted** report. Never a raw dump.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I haven't pasted raw dumps, case folders or unredacted reports, and I've read anything I pasted from a redacted report.
          required: true
