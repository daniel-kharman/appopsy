[project]
name = "appopsy"
version = "0.1.0.dev0"
description = "Read-only Android audit tool: an autopsy of what your apps have been doing"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Daniel Kharman" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
appopsy = "appopsy.cli:app"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "TID"]
ignore = [
    "S603", # subprocess without shell: the only caller is the allowlisted adb wrapper
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]  # raw adb output fixtures have long lines
"appopsy/redact.py" = ["E501"]  # detector regexes read best on one line

[tool.mypy]
strict = true
files = ["appopsy"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:pastebin"  # never upload test output

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml<6.0.12.20261001",
]
